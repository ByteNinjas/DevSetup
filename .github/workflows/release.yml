name: Release

# Tag-driven release. Pushing a `v*` tag builds the supported bundles on
# Linux (x64 + arm64, `.deb` + AppImage), Windows x64 (NSIS) and macOS
# (arm64 + x64, `.app` + `.dmg`) into a DRAFT release. Every updater artifact
# is signed, `latest.json` is generated from the uploaded assets and verified,
# and only then is the release published. The matrix is serialized on purpose:
# the first job creates the draft release, the later jobs attach their assets
# to the same release.
#
# Linux is the full-featured build. Windows and macOS are real, compiling
# previews: the UI, setup files, Git and VS Code helpers work, while apt,
# pkexec, Flatpak and other Linux-only actions stay disabled in the app.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: ubuntu-24.04-arm
            label: Linux arm64
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-latest
            label: Windows x64 preview
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15
            label: macOS arm64 preview
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            label: macOS x64 preview
            target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libfuse2t64 \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check the tag matches the app version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          app="$(jq -r .version src-tauri/tauri.conf.json)"
          pkg="$(jq -r .version package.json)"
          cargo="$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "devsetup") | .version')"
          if [ "$tag" != "$app" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag does not match tauri.conf.json ($app), package.json ($pkg) and src-tauri/Cargo.toml ($cargo). Bump all three versions before tagging."
            exit 1
          fi
          echo "Tag v$tag matches the app version - OK."

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles into the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DevSetup ${{ github.ref_name }}
          releaseBody: |
            DevSetup ${{ github.ref_name }}.

            **App updates**
            - Builds from v0.0.3 onward check for a signed update on startup and from the
              Updates card, then download, verify and install it in place.
            - Releases before v0.0.3 have no updater and must install this release manually once.
            - The `.sig` files are updater signatures; manual installs only need the bundle.

            **Linux (full feature set)**
            - `*.deb` - recommended on Debian/Ubuntu (installs `/usr/bin/devsetup` and the polkit policy)
            - `*.AppImage` - portable build; user-level tools work, system-package steps need the `.deb`
            - Architectures: x64 and arm64.

            **Windows and macOS (preview)**
            - Windows: `*.exe` (NSIS, current user). Unsigned, so SmartScreen may warn.
            - macOS: `*.dmg` (arm64 and x64). Unsigned, so Gatekeeper may block the first launch
              (right-click the app and choose Open, or allow it in System Settings).
            - These builds compile and run, but installs, cleanup, Doctor, drivers and shell
              login changes are Linux-only and stay disabled in the preview.

            Verify the file matches your platform and architecture before installing. Full
            install and usage notes live in the [README](https://github.com/${{ github.repository }}#readme).
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          # The Tauri CLI signs every updater bundle (AppImage, .deb, NSIS and
          # .app) because TAURI_SIGNING_PRIVATE_KEY is set above; tauri-action
          # uploads each .sig. The publish job refuses to publish unless every
          # platform asset has a matching signature.
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish:
    name: Publish the release
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download the draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber

      - name: Generate and verify latest.json
        run: |
          set -euo pipefail
          scripts/latest-json.sh generate release-assets \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            > latest.json
          scripts/latest-json.sh verify release-assets latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME"

      - name: Upload latest.json and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          # Publish first, then mark latest: the API refuses to make a draft latest.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release edit "$GITHUB_REF_NAME" --latest
