name: Release

# Tag-driven release. Pushing a `v*` tag builds the supported bundles on
# Linux (x64 + arm64, `.deb` + AppImage), Windows x64 (NSIS) and macOS
# (arm64 + x64, `.app` + `.dmg`), then publishes them to that tag's GitHub
# release. The matrix is serialized on purpose: the first job creates the
# release, the later jobs attach their assets to the same release. Running
# them in parallel would race several release-creation requests for one tag.
#
# Linux is the full-featured build. Windows and macOS are real, compiling
# previews: the UI, setup files, Git and VS Code helpers work, while apt,
# pkexec, Flatpak and other Linux-only actions stay disabled in the app.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            label: Linux x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: ubuntu-24.04-arm
            label: Linux arm64
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-latest
            label: Windows x64 preview
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-14
            label: macOS arm64 preview
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-14
            label: macOS x64 preview
            target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libfuse2t64 \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check the tag matches the app version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          app="$(jq -r .version src-tauri/tauri.conf.json)"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$app" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match tauri.conf.json ($app) and package.json ($pkg). Bump both versions before tagging."
            exit 1
          fi
          echo "Tag v$tag matches the app version - OK."

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundles and publish the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DevSetup ${{ github.ref_name }}
          releaseBody: |
            DevSetup ${{ github.ref_name }}.

            **Linux (full feature set)**
            - `*.deb` - recommended on Debian/Ubuntu (installs `/usr/bin/devsetup` and the polkit policy)
            - `*.AppImage` - portable build; user-level tools work, system-package steps need the `.deb`
            - Architectures: x64 and arm64.

            **Windows and macOS (preview)**
            - Windows: `*.exe` (NSIS, current user). Unsigned, so SmartScreen may warn.
            - macOS: `*.dmg` (arm64 and x64). Unsigned, so Gatekeeper may block the first launch
              (right-click the app and choose Open, or allow it in System Settings).
            - These builds compile and run, but installs, cleanup, updates, Doctor, drivers and
              shell login changes are Linux-only and stay disabled in the preview.

            Verify the file matches your platform and architecture before installing. Full
            install and usage notes live in the [README](https://github.com/${{ github.repository }}#readme).
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
