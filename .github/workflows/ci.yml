name: CI

# Cross-platform compile gate. The Linux job runs the full local gate
# (`pnpm run check`: typecheck, frontend build, Rust tests). Windows and macOS
# only compile the app and build the frontend, so a preview port regression is
# caught before a release tag is pushed.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Tauri's Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            patchelf \
            libfuse2t64 \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the gate
        run: pnpm run check

  preview:
    name: ${{ matrix.label }} compile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows x64 preview
          - runner: macos-15
            label: macOS arm64 preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node (latest LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: pnpm run build

      - name: Compile the app
        run: cargo check --manifest-path src-tauri/Cargo.toml
